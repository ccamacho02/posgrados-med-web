<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Programas de Posgrado en Medicina</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Programas de Posgrado en Medicina</h1>

        <form method="get" class="row">
            <div class="col-auto">
                <input type="text" name="busqueda" class="form-control" placeholder="Buscar programa...">
            </div>
            <div class="col-auto">
                <select name="id_universidad" class="form-select">
                    <option value="">Universidades</option>
                    {% for universidad in universidades %}
                        <option value="{{ universidad.id_universidad }}">{{ universidad.nombre_universidad }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </form>

        {% for programa in programas_academicos %}
            <div class="card mt-2">
                <div class="card-header">
                    <h4>{{programa.nombre_programa}}</h4>
                </div>
                <div class="card-body">
                    <p>{{programa.url}}</p>
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
